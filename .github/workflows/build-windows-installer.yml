name: Build Windows Installer

# Deliberately NOT triggered on every push - this compiles a full PySide6
# app with PyInstaller and then runs Inno Setup, which takes real CI
# minutes. workflow_dispatch (the Actions tab, or the API/CLI) is the
# normal way to ask for a build.
#
# workflow_dispatch on its own only works once a workflow file has been
# merged to the repo's default branch though - GitHub won't let you
# dispatch a workflow that only exists on a feature branch. The `push`
# trigger below, scoped to this branch and to changes anywhere under the
# app itself, exists only to get a build running before that merge
# decision is made, so the installer stays buildable on demand while
# this branch is under active review/testing - drop the `push` block
# (or narrow its paths back to packaging/ + this file) once main carries
# this branch and workflow_dispatch is available directly.
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Display version shown in Add/Remove Programs (e.g. 4.0.0)"
        required: false
        default: "4.0.0"
  push:
    branches:
      - claude/gracious-brahmagupta-rbw3mo
    paths:
      - "Sensei_Index_4.0/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed to publish/update the Release below
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        # Pinned to the exact versions the app is developed and tested
        # against (see Sensei_Index_4.0/START_SENSEI_INDEX.bat / the dev
        # environment) so the frozen build behaves the same as a normal
        # `pip install` run of the source would.
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.11.2 openpyxl==3.1.5 pypdf==6.18.1 reportlab==5.0.1 "pyinstaller>=6.0,<7"

      - name: Build frozen app with PyInstaller
        working-directory: Sensei_Index_4.0/packaging
        run: pyinstaller sensei_index.spec --noconfirm

      - name: Verify PyInstaller output
        working-directory: Sensei_Index_4.0/packaging
        shell: pwsh
        run: |
          $exePath = "dist\SenseiIndex\SenseiIndex.exe"
          if (-not (Test-Path $exePath)) {
            throw "PyInstaller did not produce $exePath"
          }
          Write-Host "Found $exePath"

      - name: Locate Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $found = $cmd.Source }
          }
          if (-not $found) {
            throw "Could not locate ISCC.exe (Inno Setup 6) on this runner image."
          }
          Write-Host "Using Inno Setup compiler at $found"
          "path=$found" >> $env:GITHUB_OUTPUT

      - name: Compute version numbers
        id: ver
        shell: pwsh
        run: |
          $display = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($display)) { $display = "4.0.0" }
          # VersionInfoVersion (Windows' own binary version metadata) has to
          # be strictly numeric (up to 4 dot-separated parts) - the run
          # number is always a plain increasing integer, so it's always a
          # valid 4th component regardless of what the free-form display
          # version above is set to.
          $numeric = "4.0.0.${{ github.run_number }}"
          Write-Host "Display version: $display / VersionInfo: $numeric"
          "display=$display" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT

      - name: Build installer with Inno Setup
        working-directory: Sensei_Index_4.0/packaging
        shell: pwsh
        run: |
          & "${{ steps.iscc.outputs.path }}" `
            "/DAPP_VERSION=${{ steps.ver.outputs.display }}" `
            "/DAPP_VERSION_INFO=${{ steps.ver.outputs.numeric }}" `
            installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe exited with code $LASTEXITCODE"
          }

      - name: Verify installer output
        working-directory: Sensei_Index_4.0/packaging
        shell: pwsh
        run: |
          $setupPath = "installer_output\SenseiIndex-Setup.exe"
          if (-not (Test-Path $setupPath)) {
            throw "Inno Setup did not produce $setupPath"
          }
          Write-Host "Found $setupPath"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SenseiIndex-Setup
          path: Sensei_Index_4.0/packaging/installer_output/SenseiIndex-Setup.exe
          if-no-files-found: error

      - name: Publish to a public Release (downloadable without a GitHub login)
        # Workflow-artifact downloads (the step above) always require being
        # signed into GitHub, even on a public repo - that's a platform-wide
        # anti-scraping rule, not a permissions issue with this repo. A
        # Release asset on a public repo has no such requirement, so this is
        # the link to actually hand a non-technical end user. Reuses one
        # fixed tag and overwrites its asset every run, so the download URL
        # never changes between builds.
        working-directory: Sensei_Index_4.0/packaging
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "latest-installer"
          $notesFile = New-TemporaryFile
          "Latest Sensei Index installer, auto-built from commit $($env:GITHUB_SHA.Substring(0,7))." | Set-Content -Path $notesFile
          "This release's asset is replaced by every new build - this same link keeps working." | Add-Content -Path $notesFile
          "" | Add-Content -Path $notesFile
          "Download SenseiIndex-Setup.exe below and run it." | Add-Content -Path $notesFile

          gh release view $tag 2>$null 1>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "installer_output\SenseiIndex-Setup.exe" --clobber
            gh release edit $tag --notes-file $notesFile
          } else {
            gh release create $tag "installer_output\SenseiIndex-Setup.exe" --title "Sensei Index - Latest Installer" --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) {
            throw "gh release command exited with code $LASTEXITCODE"
          }
          Write-Host "Published: https://github.com/${{ github.repository }}/releases/download/$tag/SenseiIndex-Setup.exe"
