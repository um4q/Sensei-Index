name: Build Sensei Index Windows exe

# PyInstaller does not cross-compile - a Windows .exe can only be built by
# PyInstaller running ON Windows. This repo's own dev/CI environment is
# Linux, so this workflow is the actual build machine: it runs on GitHub's
# windows-latest runner, freezes gui_app.py (and every local module it
# pulls in) into one file with PyInstaller, and uploads the result as a
# downloadable build artifact - manually triggerable (workflow_dispatch)
# so a slow full Windows build only runs when actually wanted, not on
# every push.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build from"
        required: false
        default: ""
  # workflow_dispatch alone can't be triggered via the API until this file
  # exists on the repo's default branch (GitHub only resolves a workflow_id
  # by looking there) - this repo's own default branch isn't touched from
  # here, so `push` is what actually fires this workflow for now: it runs
  # for any commit reaching this feature branch, workflow file included in
  # the very push that adds it.
  push:
    branches:
      - claude/new-session-rcv1yz
    paths:
      - "Sensei_Index_2.9/Sensei Index 2.9/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

env:
  APP_DIR: "Sensei_Index_2.9/Sensei Index 2.9"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app + build dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Sensei Index 2.95.exe
        working-directory: ${{ env.APP_DIR }}
        run: pyinstaller --clean --noconfirm SenseiIndex.spec

      - name: Smoke-test the built exe actually launches
        working-directory: ${{ env.APP_DIR }}
        shell: pwsh
        run: |
          $exe = "dist\Sensei Index 2.95.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          # Give it the data files it expects to sit next to, same as a
          # real install, so this actually exercises startup (not just
          # "the binary exists").
          Copy-Item -Recurse -Force assets dist\assets
          Copy-Item -Force *.json dist\ -ErrorAction SilentlyContinue
          Copy-Item -Force *TEMPLATE.pdf dist\ -ErrorAction SilentlyContinue
          Copy-Item -Force Equipment_Inspection_Tracker.xlsx dist\ -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -WorkingDirectory "dist" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            $code = $p.ExitCode
            Write-Host "Process exited early with code $code"
            if (Test-Path "dist\crash_log.txt") {
              Write-Host "----- crash_log.txt -----"
              Get-Content "dist\crash_log.txt" | Write-Host
            }
            throw "Exe exited on its own within 12s (code $code) - see crash_log.txt above if present"
          }
          Write-Host "Exe is still running after 12s (PID $($p.Id)) - looks like a clean, hung-in-its-event-loop startup, not a crash."
          Stop-Process -Id $p.Id -Force

      - name: Upload built exe
        uses: actions/upload-artifact@v4
        with:
          name: Sensei-Index-2.95-exe
          path: ${{ env.APP_DIR }}/dist/Sensei Index 2.95.exe
          if-no-files-found: error

      - name: Upload crash log (only if the smoke test failed and left one)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-log-if-any
          path: ${{ env.APP_DIR }}/dist/crash_log.txt
          if-no-files-found: ignore
