[pytest]
testpaths = tests
qt_api = pyside6
# A stray un-mocked modal QMessageBox/QDialog.exec() hangs forever with no
# display and no human to click it - this timeout turns that into a clear
# failure instead of a stuck test run. 15s is generous for any real test
# here; if a legitimately slow test ever needs more, mark it explicitly
# with @pytest.mark.timeout(N) rather than raising this default.
timeout = 15
